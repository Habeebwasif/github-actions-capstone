name: Main Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      run_tests: true
      node_version: "22"
      
  # Extra job: computes the 7-character commit hash for the tag
  short-sha: 
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - id: sha
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

  docker-api:
    needs: [build-test, short-sha]
    uses: ./.github/workflows/reusable-docker.yml
    with:
      image_name: ${{ vars.DOCKERHUB_USERNAME }}/notes-api
      tag: sha-${{ needs.short-sha.outputs.short_sha }}
      extra_tag: latest
      context: notes-app/backend
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_token: ${{ secrets.DOCKER_TOKEN }}

  docker-frontend:
    needs: [build-test, short-sha]
    uses: ./.github/workflows/reusable-docker.yml
    with:
      image_name: ${{ vars.DOCKERHUB_USERNAME }}/notes-frontend
      tag: sha-${{ needs.short-sha.outputs.short_sha }}
      extra_tag: latest
      context: notes-app/frontend
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_token: ${{ secrets.DOCKER_TOKEN }}

  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs:
      - docker-api
      - docker-frontend
      - short-sha

    permissions:
      security-events: write
      contents: read

    steps:
      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: habeebwasif/notes-api:sha-${{ needs.short-sha.outputs.short_sha }}
          format: sarif
          output: trivy-api-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: habeebwasif/notes-frontend:sha-${{ needs.short-sha.outputs.short_sha }}
          format: sarif
          output: trivy-frontend-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload API SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-api-results.sarif
          category: trivy-api

      - name: Upload frontend SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend-results.sarif
          category: trivy-frontend

  deploy:
    needs: [docker-api, docker-frontend, trivy-scan]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy
        run: |
          echo "Deploying image: ${{ needs.docker-api.outputs.image_url }} to production"
          echo "Deploying image: ${{ needs.docker-frontend.outputs.image_url }} to production"