name: Reusable - Docker Build & Push

on:
  workflow_call:
    inputs:
      image_name:
        type: string
        required: true
      tag:
        type: string
        required: true
      # Folder with the Dockerfile (extra input, needed for notes-app/backend and notes-app/frontend)
      context:
        type: string
        default: "."
      # Optional second tag, so one build can push both sha-<hash> and latest
      extra_tag:
        type: string
        default: ""
      docker_username:
        type: string
        required: true
    secrets:
      docker_token:
        required: true
    outputs:
      image_url:
        value: ${{ jobs.docker.outputs.image_url }}

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      image_url: ${{ steps.out.outputs.image_url }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ inputs.docker_username }}
          password: ${{ secrets.docker_token }}

      # build stage
      
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          load: true
          tags: |
           ${{ inputs.image_name }}:${{ inputs.tag }}
           ${{ inputs.extra_tag != '' && format('{0}:{1}', inputs.image_name, inputs.extra_tag) || '' }}

      # trivy scan

      - name: Trivy scan Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.image_name }}:${{ inputs.tag }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: 'true' # withoutt this any HIGH-severity CVE with no patch would fail my pipeline

      # Only runs if the scan passed
      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          push: true
          tags: |
            ${{ inputs.image_name }}:${{ inputs.tag }}
            ${{ inputs.extra_tag != '' && format('{0}:{1}', inputs.image_name, inputs.extra_tag) || '' }}

      - name: Set image_url output
        id: out
        run: echo "image_url=docker.io/${{ inputs.image_name }}:${{ inputs.tag }}" >> "$GITHUB_OUTPUT"